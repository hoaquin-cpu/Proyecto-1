<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title> Gastos </title>
    
</head>
<body>
    
    <main>

        <h1> Tracker de Gastos Personales </h1>
    
    </main>

    <form id="form-gasto">

        <input type="text" id="descripcion" placeholder="Descripcion" required>
        <input type="number" id="monto" placeholder="Monto" required>
        <input type="text" id="categoria" placeholder="Categoria">
        <input type="date" id="fecha">
        <button type="submit">Agregar Gasto</button>

    </form>

    <div class = "contenedor">

        <ul id = "lista-gastos">
        </ul>

    </div>

<script src="frontend.js"></script>
</body>
</html>
